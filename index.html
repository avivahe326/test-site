<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f0f0f0; color: #1a1a1a; }
    .container { max-width: 600px; margin: 80px auto; padding: 40px; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.10); border: 1px solid #e0e0e0; }
    h1 { font-size: 1.8rem; margin-bottom: 16px; color: #111111; }
    p { line-height: 1.6; color: #555555; margin-bottom: 12px; }
    .btn { display: inline-block; padding: 10px 24px; background: #1a1a2e; color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #333333; }
    .footer { margin-top: 32px; font-size: 0.85rem; color: #888888; border-top: 1px solid #e0e0e0; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Test Site</h1>
    <p>This is a simple demo site for testing the human_test() auto-PR feature.</p>
    <p>Try clicking the button below — it doesn't do much yet!</p>
    <a href="#" class="btn" onclick="alert('Hello from test-site!')">Click Me</a>

    <div class="feedback-section" style="margin-top: 40px; border-top: 1px solid #e0e0e0; padding-top: 24px;">
      <h2 style="font-size: 1.2rem; margin-bottom: 16px; color: #111111;">快速反馈</h2>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 0.9rem; color: #333333; margin-bottom: 6px; font-weight: 600;">视觉设计评分（1–5）</label>
        <div style="display: flex; gap: 8px;">
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="visual" value="1"> 1</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="visual" value="2"> 2</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="visual" value="3"> 3</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="visual" value="4"> 4</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="visual" value="5"> 5</label>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 0.9rem; color: #333333; margin-bottom: 6px; font-weight: 600;">功能体验评分（1–5）</label>
        <div style="display: flex; gap: 8px;">
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="function" value="1"> 1</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="function" value="2"> 2</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="function" value="3"> 3</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="function" value="4"> 4</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="function" value="5"> 5</label>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 0.9rem; color: #333333; margin-bottom: 6px; font-weight: 600;">导航与信息架构评分（1–5）</label>
        <div style="display: flex; gap: 8px;">
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="navigation" value="1"> 1</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="navigation" value="2"> 2</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="navigation" value="3"> 3</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="navigation" value="4"> 4</label>
          <label style="font-size: 0.85rem; color: #555555;"><input type="radio" name="navigation" value="5"> 5</label>
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 0.9rem; color: #333333; margin-bottom: 6px; font-weight: 600;">其他功能层面的具体意见</label>
        <textarea name="functional_feedback" rows="3" placeholder="请描述导航、交互、内容可读性等方面的体验……" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; font-size: 0.9rem; color: #333333; resize: vertical; background: #fafafa;"></textarea>
      </div>

      <button type="button" class="btn" onclick="alert('感谢您的反馈！')">提交反馈</button>
    </div>

    <div class="footer">
      <p>Built for human_test() integration testing.</p>
    </div>
  </div>
</body>
</html>
