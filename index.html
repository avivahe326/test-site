<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #efefef; color: #111; }
    /* Navigation */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: #111; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 56px;
    }
    nav .nav-brand { font-weight: 700; font-size: 1.1rem; color: #fff; text-decoration: none; }
    nav ul { list-style: none; display: flex; gap: 24px; }
    nav ul li a { color: #ccc; text-decoration: none; font-size: 0.95rem; }
    nav ul li a:hover, nav ul li a:focus { color: #fff; text-decoration: underline; }
    /* Sections */
    .container { max-width: 680px; margin: 48px auto; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    section { max-width: 680px; margin: 32px auto; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 1.8rem; margin-bottom: 16px; }
    h2 { font-size: 1.4rem; margin-bottom: 14px; color: #111; }
    p { line-height: 1.6; color: #555; margin-bottom: 12px; }
    /* Contact form */
    .contact-form label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: #333; }
    .contact-form input, .contact-form textarea {
      width: 100%; padding: 9px 12px; margin-bottom: 16px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; font-family: inherit;
    }
    .contact-form textarea { min-height: 100px; resize: vertical; }
    /* Footer */
    .btn { display: inline-block; padding: 10px 24px; background: #222; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #444; }
    .footer { margin-top: 32px; font-size: 0.85rem; color: #999; }
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #222; color: #fff; padding: 12px 28px; border-radius: 8px;
      font-size: 0.95rem; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Test Site</h1>
    <p>This is a simple demo site for testing the human_test() auto-PR feature.</p>
    <p>Try clicking the button below — it doesn't do much yet!</p>
    <button class="btn" onclick="showToast()">Click Me</button>
    <div class="footer">
      <p>Built for human_test() integration testing.</p>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite">Hello from Test Site!</div>
  <script>
    function showToast(msg) {
      var toast = document.getElementById('toast');
      if (msg) toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 3000);
    }
    function handleContact(e) {
      e.preventDefault();
      showToast('Message sent — we\'ll be in touch soon!');
      e.target.reset();
    }
  </script>
</body>
</html>
