<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1000;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #toast-close {
      margin-left: 16px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
    }

    .container { max-width: 600px; margin: 80px auto; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 1.8rem; margin-bottom: 16px; }
    p { line-height: 1.6; color: #666; margin-bottom: 12px; }
    .btn { display: inline-block; padding: 10px 24px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
    .footer { margin-top: 32px; font-size: 0.85rem; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Test Site</h1>
    <p>This is a simple demo site for testing the human_test() auto-PR feature.</p>
    <p>Try clicking the button below — it doesn't do much yet!</p>
    <a href="#" class="btn" onclick="alert('Hello from test-site!')">Click Me</a>
    <div class="footer">
      <p>Built for human_test() integration testing.</p>
    </div>
  </div>
</body>
</html>
